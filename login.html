<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Login - Password Manager</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#ea2a2a",
            "background-light": "#f8f6f6",
            "background-dark": "#181111",
          },
          fontFamily: {
            display: ["Inter", "Noto Sans", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px",
          },
        },
      },
    };
  </script>
</head>

<body class="bg-background-light dark:bg-background-dark">
  <div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden font-display">
    <div class="layout-container flex h-full grow flex-col">
      <div class="px-4 md:px-10 lg:px-40 flex flex-1 justify-center py-5">
        <div class="layout-content-container flex flex-col w-full max-w-[960px] flex-1">
          <div class="flex flex-col md:flex-row w-full grow bg-background-light dark:bg-background-dark @container">
            <div class="w-full md:w-1/2 flex flex-col justify-center p-4 md:p-8">
              <div class="flex flex-col items-center md:items-start mb-8">
                <span class="material-symbols-outlined text-primary text-5xl mb-2">lock</span>
                <p class="text-white text-lg font-bold">Password Manager</p>
              </div>
              <div class="flex flex-wrap justify-between gap-3 p-4">
                <div class="flex min-w-72 flex-col gap-3">
                  <p class="text-white text-4xl font-black leading-tight tracking-[-0.033em]">Welcome Back</p>
                  <p class="text-[#b89d9d] text-base font-normal leading-normal">Log in to your account</p>
                </div>
              </div>
              <div class="w-full px-4 py-3">
                <label class="flex flex-col min-w-40 flex-1">
                  <p class="text-white text-base font-medium leading-normal pb-2">Email</p>
                  <input
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-[#382929] focus:border-none h-14 placeholder:text-[#b89d9d] p-4 text-base font-normal leading-normal"
                    placeholder="Enter your email" />
                </label>
              </div>
              <div class="w-full px-4 py-3">
                <label class="flex flex-col min-w-40 flex-1">
                  <div class="flex justify-between items-center pb-2">
                    <p class="text-white text-base font-medium leading-normal">Password</p>
                  </div>
                  <div class="flex w-full flex-1 items-stretch rounded-lg">
                    <input
                      class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-0 border-none bg-[#382929] focus:border-none h-14 placeholder:text-[#b89d9d] p-4 rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal"
                      placeholder="Enter your password" type="password" />
                    <button aria-label="Toggle password visibility"
                      class="text-[#b89d9d] flex border-none bg-[#382929] items-center justify-center pr-4 rounded-r-lg border-l-0">
                      <span class="material-symbols-outlined">visibility</span>
                    </button>
                  </div>
                </label>
              </div>
              <div class="w-full px-4 pt-3 mt-4">
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors">
                  <span class="truncate">Login</span>
                </button>
              </div>
              <div class="text-center mt-2 px-4">
                <a class="text-primary text-sm font-medium hover:underline" href="#">Forgot Password?</a>
              </div>
              <div class="text-center mt-6 px-4">
                <p class="text-[#b89d9d]">Don't have an account? <a class="text-primary font-medium hover:underline"
                    href="#">Create an account</a></p>
              </div>
            </div>
            <div class="hidden md:flex w-1/2 items-center justify-center p-4">
              <div class="w-full aspect-[3/2] rounded-lg bg-background-dark flex items-center justify-center">
                <div class="relative">
                  <span class="material-symbols-outlined text-primary text-[200px] transform -rotate-45"
                    style="font-variation-settings: 'FILL' 1;">key</span>
                  <span
                    class="material-symbols-outlined text-background-dark text-[120px] absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 transform -rotate-45">lock</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
