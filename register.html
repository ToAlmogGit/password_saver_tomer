<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Password Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ea2a2a",
              "background-light": "#f8f6f6",
              "background-dark": "#121212",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#F7FAFC]">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col w-full max-w-[960px] flex-1">
<header class="flex items-center justify-between whitespace-nowrap px-4 sm:px-10 py-3">
<div class="flex items-center gap-4 text-white">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_330)">
<path clip-rule="evenodd" d="M24 0.757355L47.2426 24L24 47.2426L0.757355 24L24 0.757355ZM21 35.7574V12.2426L9.24264 24L21 35.7574Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>
<clippath id="clip0_6_330"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Password Manager</h2>
</div>
<a class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-red-700 transition-colors" href="#">
<span class="truncate">Log In</span>
</a>
</header>
<main class="flex-grow flex items-center justify-center py-12">
<div class="w-full max-w-md space-y-8 p-4">
<div class="text-center">
<p class="text-white text-4xl font-black leading-tight tracking-[-0.033em]">Create Your Secure Account</p>
<p class="text-[#b89d9d] text-base font-normal leading-normal mt-3">Secure your digital life with a single master password.</p>
</div>
<form class="space-y-6">
<div class="flex flex-col">
<label class="text-white text-base font-medium leading-normal pb-2" for="email">Email Address</label>
<input autocomplete="email" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#533c3c] bg-[#2D3748] focus:border-primary h-14 placeholder:text-[#b89d9d] p-[15px] text-base font-normal leading-normal" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="flex flex-col">
<label class="text-white text-base font-medium leading-normal pb-2" for="password">Master Password</label>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<input autocomplete="new-password" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#533c3c] bg-[#2D3748] focus:border-primary h-14 placeholder:text-[#b89d9d] p-[15px] pr-12 text-base font-normal leading-normal" id="password" name="password" placeholder="Enter your master password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#b89d9d] hover:text-white" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<p class="text-[#b89d9d] text-sm font-normal leading-normal pt-2">Minimum 12 characters, include uppercase, lowercase, number, and symbol.</p>
</div>
<div class="flex flex-col">
<label class="text-white text-base font-medium leading-normal pb-2" for="confirm-password">Confirm Master Password</label>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<input autocomplete="new-password" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#533c3c] bg-[#2D3748] focus:border-primary h-14 placeholder:text-[#b89d9d] p-[15px] pr-12 text-base font-normal leading-normal" id="confirm-password" name="confirm-password" placeholder="Confirm your master password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-[#b89d9d] hover:text-white" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div>
<button class="w-full flex min-w-[84px] max-w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-4 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-red-700 transition-colors" type="submit">
<span class="truncate">Register</span>
</button>
</div>
</form>
<p class="text-center text-sm text-[#b89d9d]">
                                Already have an account? <a class="font-medium text-primary hover:text-red-400" href="#">Log In</a>
</p>
</div>
</main>
<footer class="text-center py-6 text-sm text-[#b89d9d]">
<p>© 2024 Password Manager. All rights reserved.</p>
<div class="mt-2">
<a class="hover:text-white transition-colors" href="#">Terms of Service</a>
<span class="mx-2">|</span>
<a class="hover:text-white transition-colors" href="#">Privacy Policy</a>
</div>
</footer>
</div>
</div>
</div>
</div>
</body></html>
