<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
    :root {
      --primary-color: #E53E3E;--background-dark: #121212;
      --secondary-dark: #1E1E1E;
      --text-dark: #E0E0E0;
      --border-dark: #333333;
    }
  </style>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "var(--primary-color)",
            "background-light": "#F2F2F2",
            "background-dark": "var(--background-dark)",
            "text-light": "#333333",
            "text-dark": "var(--text-dark)",
            "accent": "#7ED321",
            "secondary-light": "#ffffff",
            "secondary-dark": "var(--secondary-dark)",
            "border-dark": "var(--border-dark)",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
</head>
<body class="bg-background-dark font-display text-text-dark">
<div class="flex flex-col min-h-screen">
<header class="bg-secondary-dark/50 backdrop-blur-sm sticky top-0 z-10">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<div class="flex items-center">
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-primary text-3xl">lock</span>
</div>
</div>
<div class="hidden md:flex items-center space-x-4">
<nav class="flex items-baseline space-x-4">
<a class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium" href="#">Passwords</a>
<a class="bg-gray-900 text-white px-3 py-2 rounded-md text-sm font-medium" href="#">Create</a>
<a class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium" href="#">Account</a>
<a class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium" href="#">Settings</a>
</nav>
<div class="ml-4 flex items-center md:ml-6">
<button class="bg-gray-800 p-1 rounded-full text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white" type="button">
<span class="sr-only">View notifications</span>
<span class="material-symbols-outlined">
                  notifications
                  </span>
</button>
</div>
</div>
</div>
</div>
</header>
<main class="flex-grow p-4 sm:p-6 lg:p-8">
<div class="max-w-7xl mx-auto">
<div class="mb-8">
<h1 class="text-4xl font-black leading-tight tracking-tighter text-text-dark">Create New Password</h1>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
<div class="bg-secondary-dark p-6 rounded-xl shadow-md border border-border-dark">
<h2 class="text-2xl font-bold mb-6 text-text-dark">Generate Password</h2>
<div class="mb-6">
<label class="block text-sm font-medium text-text-dark mb-2" for="generated-password">Generated Password</label>
<div class="relative">
<input class="form-input w-full rounded-lg border-border-dark bg-background-dark text-text-dark h-14 placeholder:text-gray-500 p-4 pr-20 text-base" id="generated-password" type="password" value="****************"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 space-x-2">
<button class="text-gray-400 hover:text-primary">
<span class="material-symbols-outlined">visibility</span>
</button>
<button class="text-gray-400 hover:text-primary">
<span class="material-symbols-outlined">content_copy</span>
</button>
</div>
</div>
</div>
<div class="mb-6">
<div class="flex justify-between items-center mb-2">
<p class="text-sm font-medium text-text-dark">Password Strength</p>
<p class="text-sm font-medium text-green-500">Strong</p>
</div>
<div class="w-full bg-gray-700 rounded-full h-2.5">
<div class="bg-green-500 h-2.5 rounded-full" style="width: 85%"></div>
</div>
</div>
<div class="mb-6">
<button class="w-full flex items-center justify-center h-12 px-6 bg-gray-700 text-text-dark font-bold rounded-lg hover:bg-gray-600 transition-colors">
<span class="material-symbols-outlined mr-2">refresh</span>
                Regenerate
              </button>
</div>
<div class="space-y-4">
<div>
<div class="flex justify-between items-center mb-2">
<label class="text-sm font-medium text-text-dark" for="password-length">Password Length</label>
<span class="text-sm font-medium text-primary">16</span>
</div>
<input class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary" id="password-length" max="64" min="8" type="range" value="16"/>
</div>
<div class="flex items-center">
<input checked="" class="h-4 w-4 rounded border-border-dark text-primary focus:ring-primary bg-gray-700" id="uppercase" type="checkbox"/>
<label class="ml-2 block text-sm text-text-dark" for="uppercase">Include Uppercase Letters (A-Z)</label>
</div>
<div class="flex items-center">
<input checked="" class="h-4 w-4 rounded border-border-dark text-primary focus:ring-primary bg-gray-700" id="lowercase" type="checkbox"/>
<label class="ml-2 block text-sm text-text-dark" for="lowercase">Include Lowercase Letters (a-z)</label>
</div>
<div class="flex items-center">
<input checked="" class="h-4 w-4 rounded border-border-dark text-primary focus:ring-primary bg-gray-700" id="numbers" type="checkbox"/>
<label class="ml-2 block text-sm text-text-dark" for="numbers">Include Numbers (0-9)</label>
</div>
<div class="flex items-center">
<input class="h-4 w-4 rounded border-border-dark text-primary focus:ring-primary bg-gray-700" id="special-chars" type="checkbox"/>
<label class="ml-2 block text-sm text-text-dark" for="special-chars">Include Special Characters (!@#$...)</label>
</div>
</div>
</div>
<div class="bg-secondary-dark p-6 rounded-xl shadow-md border border-border-dark">
<h2 class="text-2xl font-bold mb-6 text-text-dark">Link Website</h2>
<form class="space-y-6">
<div>
<label class="block text-sm font-medium text-text-dark mb-2" for="website-url">Website URL</label>
<input class="form-input w-full rounded-lg border-border-dark bg-background-dark text-text-dark h-14 placeholder:text-gray-500 p-4 text-base" id="website-url" placeholder="https://example.com" type="url"/>
</div>
<div>
<label class="block text-sm font-medium text-text-dark mb-2" for="username">Username/Email</label>
<input class="form-input w-full rounded-lg border-border-dark bg-background-dark text-text-dark h-14 placeholder:text-gray-500 p-4 text-base" id="username" placeholder="your.email@example.com" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-text-dark mb-2" for="notes">Notes (Optional)</label>
<textarea class="form-textarea w-full rounded-lg border-border-dark bg-background-dark text-text-dark placeholder:text-gray-500 p-4 text-base" id="notes" placeholder="Add any additional notes here..." rows="4"></textarea>
</div>
</form>
</div>
</div>
<div class="mt-8 flex justify-end space-x-4">
<button class="h-12 px-6 bg-gray-700 text-text-dark font-bold rounded-lg hover:bg-gray-600 transition-colors">Cancel</button>
<button class="h-12 px-6 bg-primary text-white font-bold rounded-lg hover:bg-red-700 transition-colors">Save</button>
</div>
</div>
</main>
</div>
</body></html>
